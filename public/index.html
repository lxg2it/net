<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Net — The Doom Scroll Antidote</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🕸️</text></svg>">
</head>
<body>
  <div class="app">
    <header>
      <h1>🕸️ Net</h1>
      <div class="header-stats" id="headerStats">
        <span class="stat unread">0 unread</span>
        <span class="stat saved">0 saved</span>
        <span class="stat total">0 total</span>
      </div>
      <div class="header-actions">
        <button id="btnRefresh" title="Refresh feed">⟳</button>
      </div>
    </header>

    <nav class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="unread">Unread</button>
      <button class="filter-btn" data-filter="saved">Saved</button>
      <select id="sourceFilter" class="source-select">
        <option value="">All sources</option>
      </select>
    </nav>

    <div class="toolbar">
      <div class="font-size-controls">
        <span class="font-size-label">A</span>
        <button class="font-size-btn" data-size="small" title="Small text">A−</button>
        <button class="font-size-btn active" data-size="medium" title="Default">A</button>
        <button class="font-size-btn" data-size="large" title="Large text">A+</button>
      </div>
    </div>

    <main id="articlesList" class="articles-list">
      <!-- Articles render here -->
    </main>

    <div id="loading" class="loading" style="display:none;">Loading…</div>
    <div id="empty" class="empty" style="display:none;">
      <p>Nothing here yet. Run a fetch to pull in articles.</p>
      <button id="btnFetch" class="btn-fetch">Fetch Now</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
